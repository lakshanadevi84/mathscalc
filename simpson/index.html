<!DOCTYPE html>
<html>
<head>
<title>Simpson Calculator</title>
</head>
<body>

<div id="splash"><h1>Simpson Calculator</h1></div>

<div id="inputPage" class="page">
<h2>Enter Values</h2>
<input id="func" placeholder="x*x">
<input id="a" type="number" placeholder="a">
<input id="b" type="number" placeholder="b">
<input id="n" type="number" placeholder="n (even)">
<button onclick="start()">Calculate</button>
<p id="error"></p>
</div>

<div id="outputPage" class="page">
<h2>Steps</h2>
<div id="boxes"></div>
<button onclick="nextStep()">Next</button>
</div>

<div id="finalPage"></div>

<script src="script.js"></script>
</body>
</html>
